[project]
name = "pompom"
version = "1.0.0"
description = "A small always-on-top Pomodoro timer"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
]

[project.scripts]
pompom = "pompom.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pompom"]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "pyinstaller>=6.0",
]
